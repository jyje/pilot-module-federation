packages:
  - 'apps/*'
  - 'next/*'
  - 'vue/*'
  - 'packages/*'
allowBuilds:
  esbuild: false
  sharp: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.62.0'
  - playwright-core@1.62.0
  - playwright@1.62.0
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - adm-zip@0.6.0
  - '@hono/node-server@2.0.10'
  - sharp@0.35.0
  - brace-expansion@5.0.8
overrides:
  '@hono/node-server': 2.0.10
  adm-zip: 0.6.0
  brace-expansion: 5.0.8
  postcss: 8.5.23
  sharp: 0.35.0
