[changelog]
header = "# Changelog\n\nAll notable changes to this project are documented in this file.\n"
body = """
{% if version %}\n## {{ version }} - {{ timestamp | date(format=\"%Y-%m-%d\") }}\n{% else %}\n## Unreleased\n{% endif %}\n{% for group, commits in commits | group_by(attribute=\"group\") %}\n### {{ group | striptags | trim | upper_first }}\n{% for commit in commits %}\n- {{ commit.message | upper_first }}\n{% endfor %}\n{% endfor %}\n"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [
  { message = "^✨ feat", group = "Features" },
  { message = "^🛠️ fix|^🐛 bug", group = "Fixes" },
  { message = "^🔐 security", group = "Security" },
  { message = "^✅ test", group = "Tests" },
  { message = "^📄 docs", group = "Documentation" },
  { message = "^🔧 chore", group = "Maintenance" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
